version: '3.8'  
services:  
  app:
    build: 
       context: ../my-market-app/shop
       dockerfile: Dockerfile
    container_name: shop
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    networks:
      - market-network
    restart: unless-stopped
  payment:
    build: 
       context: ../my-market-app/payment
       dockerfile: Dockerfile
    container_name: payment
    ports:
      - "8081:8081"
    volumes:
      - ./logs:/app/logs
    networks:
      - market-network
    restart: unless-stopped
  db:
    image: postgres:17
    container_name: database
    networks:
      - market-network
    environment:
      - POSTGRES_DB=market
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_market_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - market-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
volumes:
  postgres_market_data:
  redis-data:

networks:
  market-network: