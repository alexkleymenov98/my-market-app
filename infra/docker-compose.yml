version: '3.8'  
services:  
  app:
    build: ../my-market-app
    container_name: market-app
    ports:
      - "8080:8080"
    # environment:
    #   - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    #   - SPRING_PROFILES_ACTIVE=docker
    #   - SPRING_THREADS_VIRTUAL_ENABLED=true  # Включаем Virtual Threads
    volumes:
      - ./logs:/app/logs
    networks:
      - market-network
    restart: unless-stopped
  db:
    image: postgres:17
    container_name: database
    networks:
      - market-network
    environment:
      - POSTGRES_DB=market
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_market_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - market-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
volumes:
  postgres_market_data:
  redis-data:

networks:
  market-network: