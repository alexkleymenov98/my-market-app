version: '3.8'  
services:  
  app:
    build: 
       context: ../my-market-app/shop
       dockerfile: Dockerfile
    container_name: shop
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    networks:
      - market-network
    restart: unless-stopped
  payment:
    build: 
       context: ../my-market-app/payment
       dockerfile: Dockerfile
    container_name: payment
    ports:
      - "8081:8081"
    volumes:
      - ./logs:/app/logs
    networks:
      - market-network
    restart: unless-stopped
  db:
    image: postgres:17
    container_name: database
    networks:
      - market-network
    environment:
      - POSTGRES_DB=market
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_market_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - market-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    environment:
      # Для входа в UI будут использоваться эти параметры
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "9000:8080"
    networks:
      - market-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5 
volumes:
  postgres_market_data:
  redis-data:
  keycloak_data:

networks:
  market-network: